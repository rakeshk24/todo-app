{% extends 'base.html' %}
{% block title %}Edit Todo{% endblock %}

{% block content %}
<div class="container">
    <h1>Edit Todo</h1>

    <div class="add-todo-section">
        <form method="POST" action="{{ url_for('todos.edit_todo', todo_id=todo.id) }}" class="todo-form">
            <input
                type="text"
                name="title"
                placeholder="Todo title"
                value="{{ todo.title }}"
                required
                class="input-field"
            />
            <textarea
                name="description"
                placeholder="Description (optional)"
                class="input-field"
            >{{ todo.description or '' }}</textarea>
            <input
                type="datetime-local"
                name="deadline"
                class="input-field"
                value="{% if todo.deadline %}{{ todo.deadline.strftime('%Y-%m-%dT%H:%M') }}{% endif %}"
            />

            <div class="form-group">
                <label class="form-label">Project</label>
                <select name="project_id" class="input-field">
                    <option value="">-- No Project --</option>
                    {% for project in projects %}
                    <option value="{{ project.id }}"
                        {% if todo.project and todo.project.id == project.id %}selected{% endif %}>
                        {{ project.name }}
                    </option>
                    {% endfor %}
                </select>
            </div>

            {% if tags %}
            <div class="form-group">
                <label class="form-label">Tags</label>
                <input type="text" id="tag-search-edit" placeholder="Search tags..." class="input-field tag-search-input" />
                <div class="tag-checkboxes" id="tag-checkboxes-edit">
                    {% for tag in tags %}
                    <label class="tag-checkbox-label" data-tag-name="{{ tag.name | lower }}">
                        <input type="checkbox" name="tag_ids" value="{{ tag.id }}"
                               {% if tag in todo.tags %}checked{% endif %} />
                        <span class="tag-pill" style="background:{{ tag.color }}; color:#fff;">{{ tag.name }}</span>
                    </label>
                    {% endfor %}
                </div>
            </div>
            {% endif %}

            <div class="button-group">
                <button type="submit" class="btn btn-primary">Save Changes</button>
                <a href="{{ url_for('todos.index') }}" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
