<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo Stats</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>Todo Statistics</h1>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-value">{{ stats.total }}</div>
                <div class="stat-label">Total</div>
            </div>
            <div class="stat-card">
                <div class="stat-value">{{ stats.completed }}</div>
                <div class="stat-label">Completed</div>
            </div>
            <div class="stat-card">
                <div class="stat-value">{{ stats.overdue }}</div>
                <div class="stat-label">Overdue</div>
            </div>
            <div class="stat-card">
                <div class="stat-value">{{ stats.avg_hours }}h</div>
                <div class="stat-label">Avg. Time to Complete</div>
            </div>
        </div>

        <div class="progress-section">
            <h2>Completion Rate</h2>
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" style="width: {{ stats.rate }}%">
                    {{ stats.rate }}%
                </div>
            </div>
        </div>

        <div class="stats-back">
            <a href="{{ url_for('index') }}" class="btn btn-secondary">Back to List</a>
        </div>
    </div>
</body>
</html>
